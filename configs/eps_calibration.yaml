# Module 2: epsilon calibration (proposal §5: 3-4 eps values on the steep part of the
# attack-success curve, avoiding saturation). Run:
#   uv run python scripts/calibrate_eps.py --config configs/eps_calibration.yaml
#   uv run python scripts/calibrate_eps.py --quick --device cpu    # CPU smoke run
# The final eps set and the mask area are chosen from this run and recorded in the
# decisions log in docs/interfaces.md; nothing here is frozen until then.
seed: 0
n_images: 200            # first N of data/nips2017/selected.csv
batch_size: 25
eps_255: [1, 2, 3, 4, 6, 8]   # L-inf budgets in 1/255 pixel units (0.5 dropped: below the
                              # uint8 step, it is not a real budget after rounding)
steps: 10
alpha_ratio: 0.25        # PGD step = alpha_ratio * eps
random_start: true       # uniform start in the (masked) eps ball, seeded per cell
attacks:
  - {name: pgd}                                         # plain PGD (baseline)
  - {name: pgd_jpeg75, jpeg_quality: 75}                # differentiable JPEG in the loss
  - {name: pgd_eot, jpeg_quality: [50, 95], eot_samples: 4}   # EOT over JPEG quality
regions:
  - global               # adversarial-only arm, whole image (ignores mask_areas)
  - salient              # top-saliency blocks (masks.top_fraction_mask), as in the arms
  - low                  # lowest-saliency blocks (masks.bottom_fraction_mask): baseline check B1
mask_areas: [0.25, 0.35, 0.50]   # fraction of 8x8 blocks for the masked regions
eval_jpeg_qualities: [null, 90, 75, 60]   # null = uint8 only; all via distortions.roundtrip
out_dir: results/runs/eps_calibration             # per_image.csv (git-ignored)
summary_csv: results/eps_calibration_summary.csv  # one row per cell (small, committable)
